<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f2" id="themeColor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Brain Dump" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>Brain Dump</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;650&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      (function () {
        try {
          if (localStorage.getItem("brain-dump-theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <header class="header">
          <div class="header-copy">
            <h1>Brain Dump</h1>
            <p>Get it out of your head.</p>
          </div>
          <div class="header-actions">
            <button
              class="tool theme-btn"
              id="theme"
              type="button"
              aria-label="Toggle dark mode"
              title="Toggle dark mode"
            >
              <span id="themeIcon" aria-hidden="true">◐</span>
            </button>
            <button class="tool clear-btn" id="clear" type="button" hidden>
              Clear
            </button>
          </div>
        </header>

        <section id="transcript" class="transcript" hidden>
          <div id="messages" class="messages"></div>
        </section>

        <div class="composer">
          <section class="card">
            <textarea
              id="text"
              placeholder="What's on your mind?"
              rows="3"
              enterkeyhint="send"
              autofocus
            ></textarea>

            <div class="footer">
              <div class="tools">
                <button class="tool" id="record" type="button">
                  <span class="rec-dot" aria-hidden="true"></span>
                  <span id="recordText">Record</span>
                </button>
                <button class="tool" id="attach" type="button">＋ Attach</button>
                <input
                  id="file"
                  type="file"
                  accept="audio/*,.webm,.m4a,.mp3,.ogg"
                  hidden
                />
              </div>
              <button class="send" id="send" type="button" disabled>
                Send <span>→</span>
              </button>
            </div>

            <div id="attachment" class="attachment" hidden>
              <div class="audioinfo">
                <div class="audiosymbol" aria-hidden="true">♫</div>
                <div class="filename">
                  <strong id="audioTitle">Audio attached</strong>
                  <span id="audioName"></span>
                </div>
              </div>
              <button
                class="remove"
                id="remove"
                type="button"
                aria-label="Remove audio"
              >
                ×
              </button>
            </div>
          </section>

          <div id="error" class="error" hidden></div>
          <p class="site-footer">Private little inbox for your brain.</p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
