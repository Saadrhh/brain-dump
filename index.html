<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brain Dump" />
    <title>Brain Dump</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;650&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <header class="header">
          <div>
            <h1>Brain Dump</h1>
            <p>Get it out of your head.</p>
          </div>
          <button class="tool clear-btn" id="clear" type="button" hidden>
            Clear
          </button>
        </header>

        <section id="transcript" class="transcript" hidden>
          <div id="messages" class="messages"></div>
        </section>

        <section class="card">
          <textarea
            id="text"
            placeholder="What's on your mind?"
            autofocus
          ></textarea>

          <div class="footer">
            <div class="tools">
              <button class="tool" id="record" type="button">
                <span class="rec-dot" aria-hidden="true"></span>
                <span id="recordText">Record</span>
              </button>
              <button class="tool" id="attach" type="button">＋ Attach</button>
              <input
                id="file"
                type="file"
                accept="audio/*,.webm,.m4a,.mp3,.ogg"
                hidden
              />
            </div>
            <button class="send" id="send" type="button" disabled>
              Send <span>→</span>
            </button>
          </div>

          <div id="attachment" class="attachment" hidden>
            <div class="audioinfo">
              <div class="audiosymbol" aria-hidden="true">♫</div>
              <div class="filename">
                <strong id="audioTitle">Audio attached</strong>
                <span id="audioName"></span>
              </div>
            </div>
            <button
              class="remove"
              id="remove"
              type="button"
              aria-label="Remove audio"
            >
              ×
            </button>
          </div>

          <p class="hint">
            <span id="draftHint"></span>
            <span class="hint-keys"
              ><kbd>⌘</kbd><kbd>Enter</kbd> to send</span
            >
          </p>
        </section>

        <div id="error" class="error" hidden></div>

        <footer>Private little inbox for your brain.</footer>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
